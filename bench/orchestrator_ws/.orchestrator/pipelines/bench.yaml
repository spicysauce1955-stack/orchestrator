# Real-claude bench pipeline: plan (task) -> implement -> review (reject -> implement)
# -> merge. NO HITL gate (the benchmark runs non-interactively); merge lands the
# approved solution on the integration branch orch/<run_id>/merge, which the runner
# checks out to grade. Agent steps run in isolated worktrees, so merge is how the
# governed pipeline's result reaches the contestant repo.
mode: declarative
inputs: { task: string }
steps:
  - id: plan
    type: task
    prompt: |
      Read the task in README.md (the user task is: {{task}}). Produce a short,
      concrete implementation plan for the stub module in this repo. Output only the plan.

  - id: implement
    role: implementer
    needs: [plan]
    prompt: |
      Implement the stub module in this repo to satisfy README.md. Plan:
      {{plan.output}}
      Run `uv run --with pytest pytest -q` until the smoke tests pass. Implement the
      FULL contract described in README.md, not only the smoke tests.
    success_criteria: "uv run --with pytest pytest -q tests/"
    max_retries: 1

  - id: review
    role: reviewer
    needs: [implement]
    on_reject: implement
    output_schema: { verdict: "enum[approve,reject]" }
    prompt: |
      Review the implementation below against the full contract described in README.md
      (every rule, including the edge cases and any input validation it specifies). The
      implementer's diff:

      {{implement.diff}}

      Approve if it correctly and completely implements the contract; reject only for
      real defects (missing rules, wrong edge-case handling). Reply with a JSON object
      {"verdict": "approve"} or {"verdict": "reject"}.

  - id: merge
    type: task
    needs: [review]
    merge_strategy: sequential-rebase
